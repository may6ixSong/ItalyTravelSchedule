name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      # 오프라인 지도는 크고 자주 안 바뀌니 2주 단위로 캐시합니다.
      - name: Cache key
        id: week
        run: echo "key=tiles-$(date -u +%G)-$(( 10#$(date -u +%V) / 2 ))-${{ hashFiles('scripts/regions.geojson', 'scripts/route-corridors.geojson', 'scripts/fetch-tiles.sh') }}" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        id: tiles
        with:
          path: |
            public/tiles
            public/basemaps-assets
          key: ${{ steps.week.outputs.key }}
      - name: Fetch offline map tiles
        if: steps.tiles.outputs.cache-hit != 'true'
        continue-on-error: true
        run: bash scripts/fetch-tiles.sh public

      - name: Build
        run: npm run build
        env:
          VITE_BASE: /${{ github.event.repository.name }}/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
